name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    name: Automated Test Suite & Code Quality
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, json
        coverage: none

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate Application Key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Run Pint Code Style Verification
      run: vendor/bin/pint --test

    - name: Execute PHPUnit Feature Tests
      run: php artisan test --compact

  deploy:
    name: Continuous Deployment (CD)
    needs: laravel-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Trigger Automated Cloud Deployment
      env:
        DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK_URL }}
      run: |
        if [ -n "$DEPLOY_HOOK" ]; then
          echo "Triggering automated deployment to cloud provider..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$DEPLOY_HOOK")
          echo "Deployment hook returned HTTP status: $HTTP_STATUS"
        else
          echo "DEPLOY_HOOK_URL secret is not set. Deployment will proceed via native GitHub Git integration."
        fi
